[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jeet-analyzer"
version = "0.1.0"
description = "Read-only, token-agnostic Solana exit and wallet-cluster forensics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary - all rights reserved"}
dependencies = [
  "ijson>=3.3,<4",
  "requests>=2.31,<3",
  "websocket-client>=1.7,<2",
]

[project.optional-dependencies]
telegram = [
  "python-telegram-bot>=22.7,<23",
]
ui = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "jsonschema>=4.23,<5",
]
test = [
  "httpx>=0.27,<1",
  "pytest>=9.0.3,<10",
]

[project.scripts]
jeet-analyzer = "jeet_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["jeet_analyzer*"]
